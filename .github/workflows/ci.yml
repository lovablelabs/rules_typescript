name: CI
on:
  push:
    branches:
      - main
      - develop
  # No branch filter: a stacked PR targets the branch below it, and a filtered
  # `pull_request` fires no run at all for one -- not a skipped check, nothing.
  pull_request:

# A push to a pull request supersedes the checks still running on its previous
# head. Every other run gets a group of its own, so nothing cancels or queues
# behind a run on main.
concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Bazel jobs share their caches; docs/CI_CD.md § Caches has the sizes.
#
# - One cache-version, so every job on an OS restores the same repository,
#   bazelisk and disk-cache entries; setup-bazel adds the OS and architecture.
# - The disk cache key hashes the module files and every BUILD file, so it is
#   stable across commits that change neither, and the restore-key prefix finds
#   the newest otherwise. An exact hit is not saved again, so main refreshes
#   the entry when a BUILD or module file changes (12 of the 32 commits in the
#   two weeks to 2026-10-12). One namespace, `main`, for the jobs that build this
#   workspace's graph in one configuration: the unit legs and the integration
#   job's outer Bazel. e2e/ and examples/ are separate workspaces, where this
#   ruleset is an external repository and no action key matches, so they keep
#   no disk cache rather than spend the 10 GB on four more namespaces.
# - Only the unit legs save setup-bazel's caches, and only on main: a pull
#   request restores and never evicts main's entries, and no smaller job
#   reserves an immutable key with a partial cache before the full build has
#   filled it. The integration legs save their nested caches, also only on
#   main. Each trims its disk cache to the bound below first, so
#   restore-add-save cannot grow it past the budget.
# - Every Bazel invocation retries a failed download (setup-bazel's bazelrc;
#   the nested ones through the integration harness's rc): a cold fetch of a
#   GitHub archive meets the occasional 500.
#
# Heavy jobs run on `vars.CI_LARGE_RUNNER` (and the macOS unit leg on
# `vars.CI_LARGE_MACOS_RUNNER`) when those repository variables name a
# larger-runner label this repository may use, and on the standard runners
# otherwise.

env:
  # Uncompressed bounds; the saved entries are about a fifth of these.
  DISK_CACHE_MAX_BYTES_LINUX: "8589934592"
  DISK_CACHE_MAX_BYTES_MACOS: "6442450944"
  NESTED_DISK_CACHE_MAX_BYTES: "12884901888"
  BAZEL_REPOSITORY_CACHE: |
    - "**/MODULE.bazel"
    - "**/pnpm-lock.yaml"
    - "**/Cargo.lock"
    - .bazelversion
  BAZEL_DOWNLOAD_RETRIES: |
    common --http_connector_attempts=10
    common --http_connector_retry_max_timeout=60s
    common --http_timeout_scaling=2
    common --experimental_repository_downloader_retries=8

jobs:
  test:
    name: Unit Tests & Type Checking (${{ matrix.os }})
    strategy:
      # As in `examples` and `integration-tests`: each leg is its own runner and
      # neither is evidence about the other, so one going red must not cancel
      # the one that could still say something. Left at the default, a failure
      # in the ubuntu-only gate below took the macOS leg down with it.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ${{ vars.CI_LARGE_RUNNER || 'ubuntu-latest' }}
          - os: macos-latest
            runner: ${{ vars.CI_LARGE_MACOS_RUNNER || 'macos-latest' }}
    runs-on: ${{ matrix.runner }}
    # A cold build (Rust, protobuf, the C++ toolchain) runs 65-75 min. A job
    # that reaches its own timeout is cancelled, and a cancelled job skips the
    # post step that saves the caches, so the suite step stops first: an
    # overrun fails, and main still keeps what it built.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        id: setup
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          cache-version: "3"
          # A macOS repository cache (~3 GB) does not fit the 10 GB beside the
          # Linux one and the disk caches; that leg fetches, with retries.
          repository-cache: ${{ matrix.os == 'macos-latest' && 'false' || env.BAZEL_REPOSITORY_CACHE }}
          disk-cache: main
          cache-save: ${{ github.ref == 'refs/heads/main' }}
          bazelrc: ${{ env.BAZEL_DOWNLOAD_RETRIES }}

      # `bazel test //...` and a byte-identical Gazelle rerun are both satisfied
      # by a Gazelle run that deletes a test target, so neither notices a
      # hand-written rule going missing. This runs before them because it is a
      # loading-phase query the next step pays for anyway, and it names the
      # cause when a test simply stops existing.
      - name: Every test source file is claimed by a test target
        if: matrix.os == 'ubuntu-latest'
        run: tools/ci/check_test_sources.sh

      # Same argument one step further: nothing goes red when a test runs on no
      # leg of the integration-tests matrix, so the partition is checked here
      # rather than on a leg, off another loading-phase query.
      - name: Every integration test lands on exactly one shard
        if: matrix.os == 'ubuntu-latest'
        run: tools/ci/check_integration_shards.sh

      # A retired name a page or a comment still uses is a sentence the code
      # falsified; changelog.d is where a retirement is recorded.
      - name: No prose or code names a retired attribute, kind or provider
        if: matrix.os == 'ubuntu-latest'
        run: tools/ci/check_retired_names.sh

      # The gates keep their place in front of the suite -- the reason above
      # holds -- but a step defaults to `if: success()`, so one of them going
      # red used to skip everything below on ubuntu while fail-fast cancelled
      # macOS, and `bazel test //...` ran nowhere. That is how #74 to #77 merged
      # onto a red main with the suite effectively switched off. These two run
      # whatever the gates did; the job still fails, because a failed step
      # fails it.
      #
      # --config=ci is defined in .bazelrc. It expands --config=fast, which
      # drops the nested-Bazel targets: those run once per push, spread over the
      # legs of the integration-tests job. Unfiltered they would run three times
      # per push — twice here across the OS matrix, once there.
      # Also the type check: .bazelrc builds +_validation for every command.
      - name: Run all tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 100
        run: bazel test --config=ci //...

      # The suite never runs `bazel coverage`, and a coverage run whose report
      # is empty passes; the fixture runs under it here and its report is read.
      - name: bazel coverage on the fixture names what the filter selects
        if: >-
          ${{ !cancelled() && steps.setup.outcome == 'success' &&
              matrix.os == 'ubuntu-latest' }}
        run: tools/ci/check_coverage_report.sh

      # Native Darwin archive bundling is not exercised by a Linux cross-link.
      - name: Diagnose native archive symbols on macOS failure
        if: ${{ failure() && matrix.os == 'macos-latest' }}
        run: |
          output=$(bazel info output_path)
          output_base=$(bazel info output_base)
          libffi_source="$output_base/external/rules_rs++crate+oj_crates__libffi-sys-4.2.2/build/not_msvc.rs"
          echo "Fetched libffi build source: $libffi_source"
          if [ -f "$libffi_source" ]; then
            shasum -a 256 "$libffi_source"
            sed -n '45,65p' "$libffi_source"
          else
            echo "Fetched libffi build source is absent"
          fi
          bazel aquery '@@rules_rs++crate+oj_crates__libffi-sys-4.2.2//:_bs_' \
            --output=text --include_artifacts=true || true
          find -H "$output" -type f \( -name 'libffi.a' -o -name 'libffi_convenience.a' -o -name 'liblibffi_sys*.rlib' \) \
            -print | while IFS= read -r archive; do
            echo "$archive"
            file "$archive"
            ar -t "$archive"
            xcrun nm -g "$archive" 2>&1 \
              | grep -E 'ffi_(call|prep_cif|type_void)|file format|architecture|no symbols|cannot|error' || true
          done
          python3 - <<'PY'
          import os
          import signal
          import subprocess

          print("Diagnostic replay only: this does not verify the macOS test gate.", flush=True)
          command = [
              "bazel", "--batch", "build",
              "@@rules_rs++crate+oj_crates__libffi-sys-4.2.2//:_bs",
              "--@@rules_rs++rules_rust+rules_rust//cargo/settings:debug_std_streams_output_group=true",
              "--@@rules_rs++rules_rust+rules_rust//cargo/settings:out_dir_volatile_file_basenames=",
              "--output_groups=streams,out_dir",
          ]
          # Round up 2*(25s observed libffi + 17.42s warm validation) to minutes.
          # The job deadline can cancel this diagnostic sooner.
          process = subprocess.Popen(command, start_new_session=True)
          try:
              print(f"Diagnostic replay exit: {process.wait(timeout=120)}", flush=True)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGKILL)
              process.wait()
              print("Diagnostic budget expired; no compiler result established.", flush=True)
          PY
          find -H "$output" -type f -path '*libffi-sys-*/*' \
            \( -name 'libtool' -o -name 'Makefile' -o -name 'config.log' \
               -o -name '_bs.stdout.log' -o -name '_bs.stderr.log' \) \
            -print | while IFS= read -r diagnostic; do
            echo "$diagnostic"
            grep -E '^(AR|AR_FLAGS|ARFLAGS|RANLIB|CC|CFLAGS|LDFLAGS|old_archive_cmds|oldobjs|pic_object|non_pic_object|TARGET_OBJ|am_libffi.*OBJECTS|libffi.*OBJECTS)[[:space:]]*=|libtool: (compile|link|install):|llvm-ar|ranlib|libffi(_convenience)?\.a|checking.*(archiver|static)|error:' "$diagnostic" || true
          done
          find -H "$output" -type f -path '*libffi-sys-*/*' -name '*.lo' \
            -print | while IFS= read -r object; do
            echo "$object"
            grep -E '^(pic_object|non_pic_object)=' "$object" || true
          done

      # setup-bazel saves the disk cache in its post step, after this.
      - name: Bound the disk cache before it is saved
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: >-
          tools/ci/trim_disk_cache.sh "$HOME/.cache/bazel-disk"
          "${{ matrix.os == 'macos-latest' && env.DISK_CACHE_MAX_BYTES_MACOS || env.DISK_CACHE_MAX_BYTES_LINUX }}"

  e2e:
    name: E2E Tests
    strategy:
      # Same shape, same argument: the whole point of the second leg is that it
      # is a different OS, which it cannot report on once the first one has
      # cancelled it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 75 || 60 }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          cache-version: "3"
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE }}
          cache-save: false
          bazelrc: ${{ env.BAZEL_DOWNLOAD_RETRIES }}

      - name: e2e/basic's BUILD files are what Gazelle writes
        run: |
          cd e2e/basic
          [ ! -f pnpm-lock.yaml ] || \
            bazel run //:pnpm -- install --frozen-lockfile
          bazel run //:gazelle -- -mode=diff

      - name: Build e2e/basic
        run: cd e2e/basic && bazel build //...

      - name: Test e2e/basic
        run: cd e2e/basic && bazel test //...

  examples:
    name: Examples Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        example:
          - basic
          - app
          - react-app
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          cache-version: "3"
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE }}
          cache-save: false
          bazelrc: ${{ env.BAZEL_DOWNLOAD_RETRIES }}

      - name: The BUILD files of examples/${{ matrix.example }} are Gazelle's
        run: |
          cd examples/${{ matrix.example }}
          [ ! -f pnpm-lock.yaml ] || \
            bazel run //:pnpm -- install --frozen-lockfile
          bazel run //:gazelle -- -mode=diff

      - name: Build examples/${{ matrix.example }}
        run: cd examples/${{ matrix.example }} && bazel build //...

  determinism:
    name: Build Determinism Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          # No disk cache: the check builds from two empty output bases on purpose.
          cache-version: "3"
          cache-save: false
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE }}
          bazelrc: ${{ env.BAZEL_DOWNLOAD_RETRIES }}

      # Two output bases are two full toolchain trees. /mnt is not a separate
      # ephemeral disk on this image -- it is a directory on the root filesystem,
      # same as in `integration-tests` -- so this does not move them off the root
      # disk; it keeps them out of the checkout and puts their size in `df`.
      - name: Provision scratch space
        run: |
          sudo mkdir -p /mnt/rules_ts_det
          sudo chown "$(id -u):$(id -g)" /mnt/rules_ts_det
          df -h /mnt /

      - name: Build //tests/smoke:hello and the four tools twice, from two
          empty output bases, and compare every file byte for byte
        run: BAZEL=bazelisk tools/ci/check_determinism.sh /mnt/rules_ts_det

  integration-tests:
    # 16 nested-Bazel tests at ~3 minutes each. "cpu:2" already runs several at
    # once, so this was never serial -- but one runner only has so many cores,
    # which is what kept the lane on the critical path. These legs spread it
    # over two runners.
    name: Integration Tests (${{ matrix.shard }})
    runs-on: ${{ vars.CI_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      # As in `examples`: one leg going red must not cancel the others, or a
      # single flaky nested Bazel hides the state of the rest of the suite.
      fail-fast: false
      matrix:
        # One name per `test:ci-integration-<name>` config in //.bazelrc, which
        # is where the tag filter behind each leg lives. `core` is the
        # complement of the other, so a test added with no shard tag runs
        # there rather than nowhere; check_integration_shards.sh (in the `test`
        # job) fails if these three sources ever disagree.
        shard: [npm, core]
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          cache-version: "3"
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE }}
          disk-cache: main
          cache-save: false
          bazelrc: ${{ env.BAZEL_DOWNLOAD_RETRIES }}

      # Each nested Bazel keeps its own output base and together they need tens
      # of GB. /mnt is no longer a separate ephemeral disk on this image -- it
      # is a directory on the root filesystem, which is why the free space is
      # recorded here and again after the suite.
      #
      # Legs are separate machines, so they need no distinct path -- and one path
      # keeps a local `bazel test --config=ci-integration-<leg>` run identical to
      # what CI does.
      - name: Provision scratch space
        run: |
          sudo mkdir -p /mnt/rules_ts_it
          sudo chown "$(id -u):$(id -g)" /mnt/rules_ts_it
          mkdir -p "$HOME/.cache/bazel-repo"
          ln -s "$HOME/.cache/bazel-repo" /mnt/rules_ts_it/repository_cache
          df -h /mnt /

      # Each shard saves its complete cache; immutable shared keys let the
      # faster shard prevent the slower shard from saving its native outputs.
      - uses: actions/cache/restore@v6
        id: nested-cache
        with:
          path: |
            /mnt/rules_ts_it/disk_cache
            /mnt/rules_ts_it/bazelisk
            /mnt/rules_ts_it/pnpm
          key: nested-bazel-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('**/MODULE.bazel', '**/pnpm-lock.yaml', '**/Cargo.lock', '.bazelversion', '**/BUILD.bazel') }}
          restore-keys: |
            nested-bazel-${{ runner.os }}-${{ matrix.shard }}-

      # bazelisk takes no cross-process lock, so on a cold cache every test
      # fetches Bazel at the same instant -- measured: 7 of the 9 core tests,
      # even sharing one BAZELISK_HOME. One fetch here serialises that to a
      # single download, which is what keeps a failed cache restore from
      # turning a runner's DNS blip into a red leg. Warm, it is a no-op.
      #
      # The version comes from MODULE.bazel because that is the one the nested
      # wrapper bakes into USE_BAZEL_VERSION; .bazelversion is the fallback and
      # the two agree today. If they ever drift, this primes the wrong binary
      # and the tests fetch their own again -- slower, never wrong.
      - name: Prime the nested bazelisk cache
        run: |
          mkdir -p /mnt/rules_ts_it/bazelisk
          declared=$(grep -oP 'bazel_binaries\.download\(version = "\K[^"]+' MODULE.bazel || true)
          BAZELISK_HOME=/mnt/rules_ts_it/bazelisk \
            USE_BAZEL_VERSION="${declared:-$(cat .bazelversion)}" \
            bazelisk --version

      # A PR's runtime actions miss main's cache; built here, no group pays them inside its timeout.
      # Step timeouts below the job's: an overrun fails the step instead of
      # cancelling the job, so the nested cache is still saved.
      - name: Warm the nested runtime actions
        if: matrix.shard == 'core'
        timeout-minutes: 45
        run: |
          set -o pipefail
          bazelisk test --config=ci-integration-core \
            //tests/integration:gazelle_roundtrip_warmup_test \
            --test_env=RULES_TS_IT_SCRATCH=/mnt/rules_ts_it 2>&1 \
            | tee "${RUNNER_TEMP}/warmup.log"

      # The tests carry "cpu:2", not "exclusive", so Bazel already runs as many
      # as this runner has cores for; the config picks which of them this leg
      # owns.
      - name: Integration suite (${{ matrix.shard }})
        timeout-minutes: 120
        run: |
          set -o pipefail
          bazelisk test --config=ci-integration-${{ matrix.shard }} \
            //tests/integration/... \
            --test_env=RULES_TS_IT_SCRATCH=/mnt/rules_ts_it 2>&1 \
            | tee "${RUNNER_TEMP}/integration.log"

      # The outer log hides the nested Bazels: print each test's per-check and
      # per-invocation timings, and the tail of any test that did not pass.
      - name: Nested Bazel timings
        if: ${{ !cancelled() }}
        run: |
          du -sh /mnt/rules_ts_it/* 2>/dev/null || true
          find -L bazel-testlogs/tests/integration -name test.log 2>/dev/null | sort | while read -r log; do
            echo "=== ${log#bazel-testlogs/}"
            grep -E '^(NESTED|CHECK) ' "$log" || true
            grep -q '^ALL PASSED' "$log" || tail -n 40 "$log"
          done

      # Bazel intermittently fails to stage a store tree or a declared link
      # into the sandbox -- "[unix_jni.cc:281] <path> (No such file or directory)" for a
      # directory inside its own output base, on a different path each time. It
      # has never reproduced outside CI, so the state at the moment of failure
      # is the evidence that is missing: whether the path is absent, a symlink,
      # or a dangling one, and whether the volume simply filled up.
      - name: Diagnose a sandbox staging failure
        if: failure()
        run: |
          df -h /mnt /
          log="${RUNNER_TEMP}/integration.log"
          [ -f "$log" ] || { echo "no suite log"; exit 0; }
          paths=$(grep -oE '\[unix_jni\.cc:[0-9]+\] [^ ]+' "$log" \
            | awk '{print $2}' | sort -u)
          [ -n "$paths" ] || { echo "no unix_jni path in the log"; exit 0; }
          for p in $paths; do
            echo "=== reported missing: $p"
            cur="$p"
            while [ "$cur" != "/" ] && [ ! -e "$cur" ] && [ ! -L "$cur" ]; do
              echo "    absent: $cur"
              cur=$(dirname "$cur")
            done
            echo "    first existing ancestor:"
            ls -ld "$cur"
            ls -la "$cur" | head -40
          done

      - name: Bound the nested disk cache before it is saved
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: tools/ci/trim_disk_cache.sh /mnt/rules_ts_it/disk_cache "$NESTED_DISK_CACHE_MAX_BYTES"

      # A timed-out cold build still produces valid content-addressed outputs;
      # saving them prevents the next run from repeating the same cold timeout.
      # Main only, as for setup-bazel's caches.
      - uses: actions/cache/save@v6
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main' &&
              steps.nested-cache.outcome == 'success' &&
              steps.nested-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            /mnt/rules_ts_it/disk_cache
            /mnt/rules_ts_it/bazelisk
            /mnt/rules_ts_it/pnpm
          key: ${{ steps.nested-cache.outputs.cache-primary-key }}

  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # There is no buildifier bazel_dep in MODULE.bazel: `bazel run
      # @buildifier//:buildifier` fails with "No repository visible as
      # '@buildifier'", so the released binary is what actually runs the check.
      - name: Install buildifier
        run: |
          curl -fsSL -o /usr/local/bin/buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v8.2.1/buildifier-linux-amd64
          chmod +x /usr/local/bin/buildifier
          buildifier --version

      - name: Check BUILD and .bzl formatting
        run: buildifier --mode=check -r .

      # setup-go, not Bazel: gofmt and go vet read the go.work module graph
      # straight off the source tree, so no part of this comes from the build
      # graph and there is nothing for a Bazel invocation to contribute.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            gazelle/go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt is not clean. Run gofmt -w on:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      # tools/quickstart is named out rather than excluded: its go:embed target is
      # a genrule output, and `go list` failing there aborts a whole ./... pattern.
      - name: Vet Go
        run: |
          go vet ./gazelle/... ./tests/... ./ts/... \
            ./tools/changelog/... ./tools/copy_to_workspace/... \
            ./tools/launcher/... ./tools/lcov_merger/... ./tools/release/... \
            ./tools/toolpack/...

      # docs.yml builds the site only on push to main, so until now a PR that
      # broke the nav or a page reference was caught after it had already merged.
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Build the docs site
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
