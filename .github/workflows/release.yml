name: Release

on:
  push:
    tags:
      - "v*"
      - "tools-v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.build.outputs.tarball }}
      sha256: ${{ steps.build.outputs.sha256_hex }}
      integrity: ${{ steps.build.outputs.sha256_sri }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build release tarball
        id: build
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          TARBALL_NAME="rules_typescript-${VERSION}.tar.gz"

          # Create tarball with proper prefix
          git archive \
            --format=tar.gz \
            --prefix="rules_typescript-${VERSION}/" \
            --output="${TARBALL_NAME}" \
            HEAD

          # Compute SHA256 hash (format for SRI)
          SHA256_HEX=$(sha256sum "${TARBALL_NAME}" | awk '{print $1}')
          SHA256_BASE64=$(echo -n "${SHA256_HEX}" | xxd -r -p | base64 -w0)

          echo "tarball=${TARBALL_NAME}" >> $GITHUB_OUTPUT
          echo "sha256_hex=${SHA256_HEX}" >> $GITHUB_OUTPUT
          echo "sha256_sri=sha256-${SHA256_BASE64}" >> $GITHUB_OUTPUT

          echo "Tarball: ${TARBALL_NAME}"
          echo "SHA256 (hex): ${SHA256_HEX}"
          echo "SHA256 (SRI): sha256-${SHA256_BASE64}"

          # Verify tarball was created
          if [[ ! -f "${TARBALL_NAME}" ]]; then
            echo "ERROR: Failed to create tarball"
            exit 1
          fi
          ls -lh "${TARBALL_NAME}"

      - name: Generate attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.tarball }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.tarball }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload build artifacts for BCR workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-info
          path: |
            ${{ steps.build.outputs.tarball }}
          retention-days: 7

  update-bcr:
    name: Update BCR metadata
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-info

      - name: Update .bcr/source.json
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          INTEGRITY="${{ needs.release.outputs.integrity }}"

          if [[ -z "${INTEGRITY}" ]]; then
            echo "ERROR: the release job produced no SRI integrity hash"
            exit 1
          fi

          jq \
            --arg url "https://github.com/mikn/rules_typescript/releases/download/v${VERSION}/rules_typescript-${VERSION}.tar.gz" \
            --arg integrity "${INTEGRITY}" \
            --arg strip_prefix "rules_typescript-${VERSION}" \
            '.url = $url | .integrity = $integrity | .strip_prefix = $strip_prefix' \
            .bcr/source.json > .bcr/source.json.new
          mv .bcr/source.json.new .bcr/source.json

          echo "Updated .bcr/source.json for version ${VERSION}"
          cat .bcr/source.json

      - name: Verify BCR metadata
        run: |
          echo "=== .bcr/metadata.json ==="
          cat .bcr/metadata.json
          echo
          echo "=== .bcr/source.json ==="
          cat .bcr/source.json
          echo
          echo "=== .bcr/presubmit.yml ==="
          cat .bcr/presubmit.yml

      - name: Create PR for BCR submission
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update BCR metadata for v${{ needs.release.outputs.version }}"
          title: "chore: Update BCR metadata for v${{ needs.release.outputs.version }}"
          body: |
            This PR automatically updates the BCR metadata files for the release.

            Version: v${{ needs.release.outputs.version }}
            SHA256: ${{ needs.release.outputs.sha256 }}

            The BCR submission should reference these files from this commit.
          branch: bcr-update-${{ needs.release.outputs.version }}
          delete-branch: true

  # Optional prebuilt archives must match the release table before publication.
  tools:
    name: Tools Release
    if: startsWith(github.ref, 'refs/tags/tools-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          disk-cache: true

      - name: The tag names the table's TOOLS_VERSION
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          lock=ts/private/tools_lock.bzl
          locked="$(sed -n 's/^TOOLS_VERSION = "\([0-9]*\)"$/\1/p' "$lock")"
          if [ "$tag" != "tools-v$locked" ]; then
            echo "ERROR: $tag was pushed, $lock names tools-v$locked"
            exit 1
          fi

      - name: Build the four assets and check their SRIs against the table
        run: BAZEL=bazelisk tools/ci/check_tools_lock.sh --out dist

      - name: Generate attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Create the tools release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          name: ${{ github.ref_name }}
          body: >-
            The Go tools of rules_typescript (tsaction, ts_launcher,
            lcov_merger, copy_to_workspace), one tarball per platform, as
            ts/private/tools_lock.bzl at this tag names them.
          generate_release_notes: false
          draft: false
          prerelease: false
