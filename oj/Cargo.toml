[package]
name = "direct-cargo-bazel-deps"
version = "0.0.1"
edition = "2024"

[lib]
path = "unused.rs"

[dependencies]
oj = { git = "https://github.com/lovablelabs/oj", tag = "v0.2.49" }
deno_core = { version = "=0.412.0", default-features = false }
oj_server = { git = "https://github.com/lovablelabs/oj", tag = "v0.2.49" }
oj_js = { git = "https://github.com/lovablelabs/oj", tag = "v0.2.49" }
oj_cache = { git = "https://github.com/lovablelabs/oj", tag = "v0.2.49" }
tokio = { version = "=1.53.1", features = ["full"] }
cranelift-assembler-x64 = { version = "=0.117.2", default-features = false }
cranelift-codegen-meta = { version = "=0.117.2", default-features = false }
oj_deno_napi = { git = "https://github.com/lovablelabs/oj", tag = "v0.2.49", default-features = false }
