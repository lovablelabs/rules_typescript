lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      # index.d.ts is exactly `/// <reference types="bun-types" />`: the
      # fixture for a @types package whose entry declares nothing itself.
      '@types/bun':
        specifier: 1.4.4
        version: 1.4.4
      # culori publishes no declarations and @types/culori keeps most of its
      # own in subdirectories, so the two together are the fixture for which
      # directory a @types pairing names.
      '@types/culori':
        specifier: 2.1.1
        version: 2.1.1
      '@vitejs/plugin-react':
        specifier: 5.2.0
        version: 5.2.0(supports-color@7.2.0)(vite@8.3.5(@types/node@24.19.2)(esbuild@0.28.2))
      '@vitest/coverage-v8':
        specifier: 4.1.12
        version: 4.1.12(vitest@4.1.12)
      # bun-types@1.1.34 pins @types/node ~20.12.8 beside the root's 24.19.2 and
      # its index.d.ts references `node`: the type library the chain answers.
      bun-types:
        specifier: 1.1.34
        version: 1.1.34
      culori:
        specifier: 4.0.2
        version: 4.0.2
      happy-dom:
        specifier: 21.0.4
        version: 21.0.4
      oxlint:
        specifier: 1.90.0
        version: 1.90.0
      test-exclude:
        specifier: 7.0.2
        version: 7.0.2
      typescript:
        specifier: 6.0.3
        version: 6.0.3
      vite:
        specifier: 8.3.5
        version: 8.3.5(@types/node@24.19.2)(esbuild@0.28.2)
      vitest:
        specifier: 4.1.12
        version: 4.1.12(@types/node@24.19.2)(@vitest/coverage-v8@4.1.12)(happy-dom@21.0.4)(vite@8.3.5(@types/node@24.19.2)(esbuild@0.28.2))
      zod:
        specifier: 3.24.2
        version: 3.24.2
      # workspace:* dep — points at packages/shared in the repo.
      # npm_translate_lock should generate an alias in @npm.
      shared:
        specifier: workspace:*
        version: link:packages/shared
      # A member whose package.json declares an `exports` map instead of an
      # index: every specifier under `pulse` resolves only if the hub target
      # carries what that map says, so the map is the fixture.
      pulse:
        specifier: workspace:*
        version: link:packages/pulse
      # A member under tests/, imported by the scoped name its package.json
      # declares: //tests/compiler_options/member/consumer resolves it through
      # the hub's view.
      '@acme/ui':
        specifier: workspace:*
        version: link:tests/compiler_options/member/lib
      # A member under jsx: preserve whose manifest exports a .tsx: the view's
      # manifest as built names the .jsx the member emits.
      preserve-view:
        specifier: workspace:*
        version: link:tests/jsx_preserve/member
      # A member reached by a `.ts` subpath from another member's own file:
      # subpath-member has no `exports` map, as an application package has.
      by-name-member:
        specifier: workspace:*
        version: link:packages/by-name-member
      subpath-member:
        specifier: workspace:*
        version: link:packages/subpath-member
    devDependencies:
      '@types/node':
        specifier: 24.19.2
        version: 24.19.2
      tsup:
        specifier: 9.0.0
        version: 9.0.0(postcss@8.5.32)(typescript@6.0.3)

  packages/shared:
    dependencies:
      zod:
        specifier: ^3.0.0
        version: 3.24.2

  packages/by-name-member:
    dependencies:
      subpath-member:
        specifier: workspace:*
        version: link:../subpath-member

  # Non-root importer with an importer-relative workspace link: pnpm writes
  # link: targets relative to the importer, so this one resolves to
  # packages/nested-shared at the workspace root.
  tests/npm/nested:
    dependencies:
      nested-shared:
        specifier: workspace:*
        version: link:../../../packages/nested-shared
      # The member below, linked here and nowhere above: the one route a
      # consumer names it by.
      hoisted-member:
        specifier: workspace:*
        version: link:../../../packages/hoisted-member

  # A member the root importer does not link: pnpm hoists its name, and its
  # compile walks up to the root's node_modules through this importer.
  packages/hoisted-member:
    dependencies:
      zod:
        specifier: ^3.0.0
        version: 3.24.2

