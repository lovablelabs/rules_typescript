# A second, deliberately tiny lockfile for the pnpm features that are not about
# graph size: patched dependencies, npm alias specifiers, peer-dependency
# variants and per-importer resolution, plus the blocks a reader has to walk past
# without reading (catalogs, overrides).
#
# Separate from pnpm-lock.yaml because that file is copied verbatim into the
# integration and bootstrap scratch workspaces, which know nothing about patch
# files; a patchedDependencies entry there would fail every one of them.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

# Neither block may reach a target. Both are already resolved at every use site,
# and both are shaped like blocks that ARE read -- a catalog nests the same
# specifier/version pairs an importer does, and `nanoid@2` reads as a package
# key -- so the only thing keeping them out is that each reader anchors on its
# own section header.
catalogs:
  default:
    zod:
      specifier: 3.24.2
      version: 3.24.2
    catalog-only-package:
      specifier: npm:nanoid@9.9.9
      version: nanoid@9.9.9
    styles-alias:
      specifier: npm:ansi-styles@6.2.3
      version: 6.2.3

overrides:
  nanoid@2: 3.3.11
  'zod>nanoid': 3.3.11

# The patch's own sha256. pnpm writes this when it writes the patch, so it is a
# usable content check on the file before it is applied.
#
# The scoped entry is the shape that has a second failure mode of its own: pnpm
# names its patch file after the package with `/` replaced by `__`, so the
# filename still starts with '@', and a target name starting with '@' cannot come
# out of glob().
patchedDependencies:
  '@types/ms@2.1.0': 384aa81ade2cdcee50b83f6a65b91d565b53299919c172cac3c6d5676c0c65fd
  nanoid@3.3.11: c55f4f6ee369a589edbbc9e7c7d0731b078544f72aed77ff416bdc9d831333fd
  # zod imports ansi-regex, which it does not declare; the hidden hoist
  # answers, as it does in a checkout (tests/npm/features/hoist).
  zod@3.24.2: 0d3863c296f0fd6a3d3996163221a9ab4fb01db6531cb28cee874c69a0486a54

importers:

  .:
    dependencies:
      zod:
        specifier: 3.24.2
        version: 3.24.2
      # An npm alias declared only here, by the workspace root. No package in
      # the graph names it, so the label exists only if importers are read for
      # aliases as well as for workspace links.
      ms-alias:
        specifier: npm:ms@2.1.3
        version: ms@2.1.3
      # The same thing routed through a catalog, so the alias's own name is the
      # only place `npm:` ever appeared: pnpm substitutes the catalog entry and
      # leaves the use site spelled `catalog:`. The resolution carries a peer
      # set, which is the whole point -- an alias to a package pnpm resolved
      # against peers is what the workspace actually has (tailwindcss-v3 in the
      # Lovable monorepo).
      styles-alias:
        specifier: 'catalog:'
        version: ansi-styles@6.2.3(ansi-regex@6.2.2)
      # A workspace member: the name `ws-linked` exists only in the lockfile, and
      # an import of it is answered by the hub's npm_workspace_package view.
      ws-linked:
        specifier: workspace:*
        version: link:packages/ws-linked
      # Three members entered through `main` (boundary-member, leaf-member) or
      # through `exports` alone (exports-member); each builds as //packages/<m>:<m>.
      boundary-member:
        specifier: workspace:*
        version: link:packages/boundary-member
      leaf-member:
        specifier: workspace:*
        version: link:packages/leaf-member
      exports-member:
        specifier: workspace:*
        version: link:packages/exports-member
      # The member with no target: its BUILD file holds a lone `ts_config` and
      # declares nothing named `no-target-member`, so the hub writes no label.
      no-target-member:
        specifier: workspace:*
        version: link:packages/no-target-member
      # A vendored tarball: pnpm locks the file's integrity, and its package key
      # carries the path where a registry package has its version.
      '@vendored/local-pkg':
        specifier: file:vendor/vendored-local-pkg-1.0.0.tgz
        version: file:vendor/vendored-local-pkg-1.0.0.tgz
    devDependencies:
      '@types/ms':
        specifier: 2.1.0
        version: 2.1.0
      '@types/node':
        specifier: 22.20.1
        version: 22.20.1

  # Two workspace members that resolve one name to two different majors, and one
  # package that pnpm resolved twice -- once per peer set. Both are recorded the
  # way pnpm records them: the importer names the snapshot it got, and the
  # snapshot key carries the peer set (compare
  # '@vitest/mocker@3.0.9(vite@6.4.1)' in tests/npm/pnpm-lock.yaml).
  #
  # The peer relationship itself is invented -- ansi-styles has no peer on
  # ansi-regex -- so that the fixture stays a handful of small real tarballs
  # instead of a storybook/react closure. What is under test is the SHAPE, and
  # every integrity here is the published one, so the packages really download.
  # A member whose own directory is named after an npm package in the same
  # lockfile: the hub then needs a package `ms/` and a target `:ms` side by side.
  ms:
    dependencies:
      zod:
        specifier: 3.24.2
        version: 3.24.2

  app-a:
    dependencies:
      ansi-regex:
        specifier: ^5.0.0
        version: 5.0.1
      ansi-styles:
        specifier: ^6.0.0
        version: 6.2.3(ansi-regex@5.0.1)

  app-b:
    dependencies:
      ansi-regex:
        specifier: ^6.0.0
        version: 6.2.2
      ansi-styles:
        specifier: ^6.0.0
        version: 6.2.3(ansi-regex@6.2.2)

packages:

  # One entry per published tarball, peer sets nowhere in sight: `packages:` is
  # keyed by name@version and says nothing about how many ways a package was
  # resolved.
  '@types/ms@2.1.0':
    resolution: {integrity: sha512-GsCCIZDE/p3i96vtEqx+7dBUGXrc7zeSK3wwPHIaRThS+9OhWIXRqzs4d6k1SVU8g91DrNRWxWUGhp5KXQb2VA==}

  '@types/node@22.20.1':
    resolution: {integrity: sha512-EANqOCF9QFyra+4pfxUcX9STKJpCLjMbObVzljIJomAWSnuSIEAvyzEU53GaajbXJEgdh0iEcPL+DGvpUd4k1Q==}

  '@vendored/local-pkg@file:vendor/vendored-local-pkg-1.0.0.tgz':
    resolution: {integrity: sha512-lknO1+gJFNzEyadnN/Q+NEZgFePkqq3w+K7uKjwWIKeroa6csLbQWkYQUeunDfDTUSzCZcMnXHj4PWVCDpRweQ==, tarball: file:vendor/vendored-local-pkg-1.0.0.tgz}
    version: 1.0.0

  ansi-regex@5.0.1:
    resolution: {integrity: sha512-quJQXlTSUGL2LH9SUXo8VwsY4soanhgo6LNSm84E1LBcE8s3O0wpdiRzyR9z/ZZJMlMWv37qOOb9pdJlMUEKFQ==}
    engines: {node: '>=8'}

  ansi-regex@6.2.2:
    resolution: {integrity: sha512-Bq3SmSpyFHaWjPk8If9yc6svM8c56dB5BAtW4Qbw5jHTwwXXcTLoRMkpDJp6VL0XzlWaCHTXrkFURMYmD0sLqg==}
    engines: {node: '>=12'}

  ansi-styles@6.2.3:
    resolution: {integrity: sha512-4Dj6M28JB+oAH8kFkTLUo+a2jwOFkuqb3yucU0CANcRRUbxS0cP0nZYCGjcc3BNXwRIsUVmDGgzawme7zvJHvg==}
    engines: {node: '>=12'}
    peerDependencies:
      ansi-regex: '*'

  eastasianwidth@0.2.0:
    resolution: {integrity: sha512-I88TYZWc9XiYHRQ4/3c5rjjfgkjhLyW2luGIheGERbNQ6OY7yTybanSpDXZa8y7VUP9YmDcYa+eyq4ca7iLqWA==}

  emoji-regex@9.2.2:
    resolution: {integrity: sha512-L18DaJsXSUk2+42pv8mLs5jJT2hqFkFE4j21wOmgbUqsZ2hL72NsUU785g9RXgo3s0ZNgVl42TiHp3ZtOv/Vyg==}

  ms@2.1.3:
    resolution: {integrity: sha512-6FlzubTLZG3J2a/NVCAleEhjzq5oxgHyaCU9yYXvcLsvoVaHJq/s5xXI6/XXP6tz7R9xAOtHnSO/tXtF3WRTlA==}

  nanoid@3.3.11:
    resolution: {integrity: sha512-N8SpfPUnUp1bK+PMYW8qSWdl9U+wwNWI4QKxOYDy9JAro3WMX7p2OeVRF9v+347pnakNevPmiHhNmZ2HbFA76w==}
    engines: {node: ^10 || ^12 || ^13.7 || ^14 || >=15.0.1}
    hasBin: true

  string-width@5.1.2:
    resolution: {integrity: sha512-HnLOCR3vjcY8beoNLtcjZ5/nxn2afmME6lhrDrebokqMap+XbeW8n9TXpPDOqdGK5qcI3oT0GKTW6wC7EMiVqA==}
    engines: {node: '>=12'}

  strip-ansi@7.2.0:
    resolution: {integrity: sha512-yDPMNjp4WyfYBkHnjIRLfca1i6KMyGCtsVgoKe/z1+6vukgaENdgGBZt+ZmKPc4gavvEZ5OgHfHdrazhgNyG7w==}
    engines: {node: '>=12'}

  undici-types@6.21.0:
    resolution: {integrity: sha512-iwDZqg0QAGrg9Rav5H4n0M64c3mkR59cJ6wQp+7C4nI0gsmExaedaYLNO44eT4AtBBwjbTiGPMlt2Md0T9H9JQ==}

  wrap-ansi@8.1.0:
    resolution: {integrity: sha512-si7QWI6zUMq56bESFvagtmzMdGOtoxfR+Sez11Mobfc7tm+VkUckk9bW2UeffTGVUbOksxmSw0AA2gs8g71NCQ==}
    engines: {node: '>=12'}

  zod@3.24.2:
    resolution: {integrity: sha512-lY7CDW43ECgW9u1TcT3IoXHflywfVqDYze4waEz812jR/bZ8FHDsl7pFQoSZTz5N+2NqRXs8GBwnAwo3ZNxqhQ==}

snapshots:

  '@types/ms@2.1.0': {}

  '@types/node@22.20.1':
    dependencies:
      undici-types: 6.21.0

  '@vendored/local-pkg@file:vendor/vendored-local-pkg-1.0.0.tgz': {}

  ansi-regex@5.0.1: {}

  ansi-regex@6.2.2: {}

  # The same tarball, twice, with different transitive versions. Collapsing these
  # onto `ansi-styles@6.2.3` leaves whichever the reader saw last, and both
  # importers then build against it.
  ansi-styles@6.2.3(ansi-regex@5.0.1):
    dependencies:
      ansi-regex: 5.0.1

  ansi-styles@6.2.3(ansi-regex@6.2.2):
    dependencies:
      ansi-regex: 6.2.2

  eastasianwidth@0.2.0: {}

  emoji-regex@9.2.2: {}

  ms@2.1.3: {}

  nanoid@3.3.11: {}

  string-width@5.1.2:
    dependencies:
      eastasianwidth: 0.2.0
      emoji-regex: 9.2.2
      strip-ansi: 7.2.0

  strip-ansi@7.2.0:
    dependencies:
      ansi-regex: 6.2.2

  undici-types@6.21.0: {}

  # A dependent of ansi-styles, and the only route to the (ansi-regex@6.2.2)
  # resolution that does not go through an importer. Its own key carries the peer
  # set too: pnpm propagates the decoration to every node above the package whose
  # peers were resolved, which is why `vite-node@3.0.9(@types/node@22.20.1)` in
  # tests/npm/pnpm-lock.yaml is suffixed while vite-node declares no peer itself.
  wrap-ansi@8.1.0(ansi-regex@6.2.2):
    dependencies:
      ansi-styles: 6.2.3(ansi-regex@6.2.2)
      string-width: 5.1.2
      strip-ansi: 7.2.0

  # An npm alias declared only by a package, so the dependency edge itself has
  # to carry the name zod imports nanoid under.
  zod@3.24.2:
    dependencies:
      nano-alias: nanoid@3.3.11
