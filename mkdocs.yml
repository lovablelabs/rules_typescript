site_name: rules_typescript
site_url: https://mikn.github.io/rules_typescript
site_description: Opinionated Bazel rules for TypeScript. Oxc and tsgo compile, tsgo type-checks, and Vite serves the generated config.
repo_url: https://github.com/mikn/rules_typescript
repo_name: mikn/rules_typescript

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mikn/rules_typescript

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Isolated Declarations: getting-started/isolated-declarations.md
    - IDE Setup: getting-started/ide-setup.md
    - Migrating from rules_ts: getting-started/migration.md
  - Guides:
    - npm Dependencies: guides/npm.md
    - Testing with vitest: guides/testing.md
    - Bundling with Vite: guides/bundling.md
    - Dev Server: guides/dev-server.md
    - Runtime Tools: guides/runtime-tools.md
    - Tailwind v4: guides/tailwind.md
    - Monorepo Layout: guides/monorepo.md
    - Troubleshooting: guides/troubleshooting.md
    - Lint: guides/lint.md
    - Format: guides/format.md
    - Benchmark: guides/benchmark.md
  - Gazelle:
    - Overview: gazelle/overview.md
    - Directives Reference: gazelle/directives.md
  - Rules Reference:
    - ts_compile: rules/ts-compile.md
    - ts_test: rules/ts-test.md
    - ts_binary: rules/ts-binary.md
    - ts_dev_server: rules/ts-dev-server.md
    - ts_codegen: rules/ts-codegen.md
    - ts_proto_library: rules/ts-proto-library.md
    - node_modules: rules/node-modules.md
    - Providers and toolchains: rules/providers.md
  - Compatibility: compatibility.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - Maintainers:
    - CI/CD: CI_CD.md
    - Release Process: RELEASE_PROCESS.md
    - BCR Submission: BCR_SUBMISSION.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
